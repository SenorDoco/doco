purpose: "Architecture Decision Records: durable rationale for choices about
  structure, technology, and tradeoffs."
guidelines: >-
  One **Decision** per choice. Required fields: `question`, `chosen`,
  `alternatives`. Recommended sections:


  - **Context** — what forces are in play

  - **Options considered** — list every alternative weighed

  - **Choice** — what was decided

  - **Consequences** — what becomes easier/harder


  Number ADRs sequentially using the `number` field ("ADR-042"). Use
  `supersedes`/`superseded_by` when a new ADR replaces an old one.
