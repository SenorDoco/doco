name: bugs
icon: 🐞
purpose: Reported defects and their fixes. The bridge between symptoms users see
  and the rationale behind the fix.
guidelines: >-
  Each bug:


  1. **Action** capturing the report — `verb: report_bug`, severity, repro
  steps, link to source (ticket / chat / commit).

  2. **Decision** capturing the fix — what was wrong, why the fix is correct,
  regression-test added.

  3. The fix Action references the bug Action via `decision_ids` and the
  Decision; chain via `follows` if the fix depends on prior decisions.


  Set `scope_bugfix` (or this scope) on both. Optionally tag a
  `scope_regression_guard` if a test was added.
