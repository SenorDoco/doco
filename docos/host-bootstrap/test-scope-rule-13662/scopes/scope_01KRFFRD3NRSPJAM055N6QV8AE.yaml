name: constitution
icon: ⚖️
purpose: The load-bearing claims that govern this Doco — invariants, authority,
  and the rules that other rules cite. Every Doco has one.
guidelines: >-
  The Constitution is where you put the rules that other rules cite. It's not a
  list of "nice-to-haves" — it's the schema-shaped commitments the project is
  held to.


  What belongs here:

  - **Rules** that other Rules / Decisions reference. ("Every public endpoint
  must enforce auth", "ULIDs are the canonical id".)

  - **Decisions** that are load-bearing — those the system as a whole depends
  on. (ADR-level material per ADR-105.)

  - **Intents** that name the stakeholder behind each Rule / Decision — every
  Constitution node should trace back to a stakeholder intent.


  What does NOT belong:

  - Implementation details (those live in scope_userflow / scope_design_language
  / scope_coding_style).

  - One-off bug fixes (scope_bugfix).

  - Speculative ideas (scope_meta).


  The Constitution has its own deterministic rules (declared in its `rules`
  array):

  - **mandatory_scope** — declare scopes that every node in this Doco must list.

  - **requires_edge to intent** — every Constitution node must reference at
  least one Intent.


  If you need a new invariant, capture it as a Rule in this scope. If it
  warrants its own ADR, write the Decision here too.
