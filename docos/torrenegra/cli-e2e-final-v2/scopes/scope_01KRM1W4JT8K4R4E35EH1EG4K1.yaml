    reason: Agents must proactively surface this Doco's scope manifest to the
      project owner — naming each scope, its purpose, and which carry the
      `watched` flag — and remind them that watched scopes only stay
      load-bearing when the project owner reviews them as the project evolves,
      retiring stale ones, sharpening vague ones, and adding new ones whose
      absence would let real work slip out of view.
