name: user-flows
icon: 🌊
purpose: "End-to-end user journeys: how a person (or external system) moves
  through a feature from start to finish."
guidelines: >-
  Treat each flow as a sequence. Use BPMN-style decomposition:


  - One **Intent** per flow ("user buys a product", "agent claims a Doco").

  - One or more **Actions** per step the user/system performs. Chain them with
  the `follows` field so the order is explicit and the cycle-lint guards against
  loops.

  - One **Decision** per branch ("if cart total > $X, require 2FA"). Reference
  the Decision from the Action that depends on it via `decision_ids`.

  - Use **Reasoning** to justify non-obvious orderings or merges.


  Don't try to capture state diagrams here — Doco is process-centric, not
  state-machine-centric.
